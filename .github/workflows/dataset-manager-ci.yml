name: Dataset Manager CI

on:
  push:
    branches:
      - feature/react-dataset-manager
  pull_request:
    paths:
      - 'apps/api/**'
      - 'apps/web/**'
      - 'docker-compose.yml'
      - '.github/workflows/dataset-manager-ci.yml'

jobs:
  api-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - run: pip install -r apps/api/requirements.txt
      - run: python -m compileall -q apps/api/app
      - run: pytest -q apps/api/tests

  web-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package.json
      - run: npm install
      - run: npm run build
      - run: npm test -- --run
